name: Add Word

on:
  workflow_dispatch:
    inputs:
      word:
        description: 'The word to add'
        required: true
        type: string
      date:
        description: 'Date to add the word to (YYYYMMDD). Leave empty for today.'
        required: false
        type: string
      overwrite:
        description: 'Overwrite existing word if one exists for the date'
        required: false
        type: boolean
        default: false
      preserve_case:
        description: 'Keep original capitalization (for proper nouns, acronyms, or brands like "Japan", "NASA", "iPhone")'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: add-word
  cancel-in-progress: false

jobs:
  add-word:
    runs-on: ubuntu-latest
    env:
      COLOR_PRIMARY: ${{ vars.COLOR_PRIMARY }}
      COLOR_PRIMARY_DARK: ${{ vars.COLOR_PRIMARY_DARK }}
      COLOR_PRIMARY_LIGHT: ${{ vars.COLOR_PRIMARY_LIGHT }}
      DICTIONARY_ADAPTER: ${{ vars.DICTIONARY_ADAPTER }}
      DICTIONARY_FALLBACK: ${{ vars.DICTIONARY_FALLBACK }}
      MERRIAM_WEBSTER_API_KEY: ${{ secrets.MERRIAM_WEBSTER_API_KEY }}
      MERRIAM_WEBSTER_API_URL: ${{ vars.MERRIAM_WEBSTER_API_URL }}
      MERRIAM_WEBSTER_DICTIONARY: ${{ vars.MERRIAM_WEBSTER_DICTIONARY }}
      SITE_AUTHOR: ${{ vars.SITE_AUTHOR }}
      SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
      SITE_ID: ${{ vars.SITE_ID }}
      SITE_TITLE: ${{ vars.SITE_TITLE }}
      SITE_URL: ${{ vars.SITE_URL }}
      TZ: America/New_York
      WORDNIK_API_KEY: ${{ secrets.WORDNIK_API_KEY }}
      WORDNIK_API_URL: ${{ vars.WORDNIK_API_URL }}
    steps:
      - name: Validate API key
        run: |
          if [ -z "$WORDNIK_API_KEY" ]; then
            echo "::error::WORDNIK_API_KEY is not set. Please add it to your repository secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add word
        id: add_word
        env:
          WORD: ${{ inputs.word }}
          DATE: ${{ inputs.date }}
          OVERWRITE: ${{ inputs.overwrite }}
          PRESERVE_CASE: ${{ inputs.preserve_case }}
        run: |
          # Parameter expansion only: xargs would read the apostrophe in
          # "don't" as an opening quote
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          WORD=$(trim "$WORD")
          DATE=$(trim "$DATE")

          # A line break would let the word write extra step outputs below
          if [[ -z "$WORD" || "$WORD" == *$'\n'* ]]; then
            echo "::error::Word cannot be empty, whitespace only, or span lines"
            exit 1
          fi

          # Build flags array to avoid quoting issues
          FLAGS=()
          if [[ "$OVERWRITE" == "true" ]]; then
            FLAGS+=(--overwrite)
          fi
          if [[ "$PRESERVE_CASE" == "true" ]]; then
            FLAGS+=(--preserve-case)
          fi

          # The first -- ends npm's options and the second ends the tool's, so
          # a word that starts with a dash is still read as the word
          if npm run tool:add-word -- "${FLAGS[@]}" -- "$WORD" "$DATE"; then
            echo "word_added=1" >> "$GITHUB_OUTPUT"
            echo "word=$WORD" >> "$GITHUB_OUTPUT"

            # Complete generation: renders the new word, skips every image that
            # is already current, and is the only run that certifies the cache
            npm run tool:generate-images
          else
            echo "::error::Failed to add word: $WORD"
            echo "word_added=0" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Configure Git
        if: steps.add_word.outputs.word_added == '1'
        run: |
          git config --local user.email "$GITHUB_REPOSITORY_OWNER@users.noreply.github.com"
          git config --local user.name "$GITHUB_REPOSITORY_OWNER"

      - name: Commit and push changes
        if: steps.add_word.outputs.word_added == '1'
        env:
          WORD: ${{ steps.add_word.outputs.word }}
        run: |
          git add data/ public/
          git commit -m "Add word: $WORD"
          git push origin "$GITHUB_REF"
